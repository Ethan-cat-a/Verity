name: macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build VERITY
        run: |
          xcodebuild \
            -project VERITY.xcodeproj \
            -scheme VERITY \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/VERITY-Build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc sign and verify the app bundle
        run: |
          APP_PATH="$RUNNER_TEMP/VERITY-Build/Build/Products/Release/VERITY.app"
          # Ad-hoc signing gives the bundle a verifiable code signature; it is
          # not a replacement for a Developer ID certificate or notarization.
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Generate the VERITY app icon
        run: |
          APP_PATH="$RUNNER_TEMP/VERITY-Build/Build/Products/Release/VERITY.app"
          ICONSET="$RUNNER_TEMP/VERITY-AppIcon.iconset"
          mkdir -p "$APP_PATH/Contents/Resources"
          swift scripts/GenerateAppIcon.swift "$ICONSET"
          iconutil -c icns "$ICONSET" -o "$APP_PATH/Contents/Resources/AppIcon.icns"
          test -s "$APP_PATH/Contents/Resources/AppIcon.icns"

      - name: Package the Mac app and installer disk image
        run: |
          APP_PATH="$RUNNER_TEMP/VERITY-Build/Build/Products/Release/VERITY.app"
          test -d "$APP_PATH"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/VERITY-$VERSION-macOS.zip"

          STAGING="$RUNNER_TEMP/VERITY-DMG"
          mkdir -p "$STAGING"
          ditto "$APP_PATH" "$STAGING/VERITY.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "VERITY $VERSION" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$GITHUB_WORKSPACE/VERITY-$VERSION-macOS.dmg"

      - name: Upload downloadable Mac installers
        uses: actions/upload-artifact@v4
        with:
          name: VERITY-macOS
          path: |
            VERITY-*-macOS.zip
            VERITY-*-macOS.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the built app
        uses: actions/download-artifact@v4
        with:
          name: VERITY-macOS
          path: release-assets

      - name: Publish a permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DMG="$(find release-assets -name 'VERITY-*-macOS.dmg' -print -quit)"
          ZIP="$(find release-assets -name 'VERITY-*-macOS.zip' -print -quit)"
          VERSION="${DMG##*/VERITY-}"
          VERSION="${VERSION%-macOS.dmg}"
          TAG="v$VERSION"
          test -n "$DMG"
          test -n "$ZIP"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$DMG" "$ZIP" \
              --title "VERITY $TAG" \
              --target "$GITHUB_SHA" \
              --notes "VERITY $VERSION for macOS. Download the DMG, open it, and drag VERITY.app into Applications."
          fi
