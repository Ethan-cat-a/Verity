name: macOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run regression tests
        run: |
          swiftc -parse-as-library \
            VERITY/VerityResponseParser.swift \
            VERITY/VerityMemoryCipher.swift \
            VERITY/VerityMemory.swift \
            VERITY/VerityKeychain.swift \
            VERITY/VerityScriptedReplies.swift \
            VERITY/VerityScreenSignals.swift \
            Tests/VerityRegressionTests.swift \
            -o "$RUNNER_TEMP/VERITY-RegressionTests"
          "$RUNNER_TEMP/VERITY-RegressionTests"
          swiftc -parse-as-library \
            VERITY/VerityResponseParser.swift \
            VERITY/VerityDocumentAI.swift \
            Tests/VerityFileAccessTests.swift \
            -o "$RUNNER_TEMP/VERITY-FileAccessTests"
          "$RUNNER_TEMP/VERITY-FileAccessTests"
          swiftc -parse-as-library \
            VERITY/VerityUpdateChecker.swift \
            Tests/VerityUpdateTests.swift \
            -o "$RUNNER_TEMP/VERITY-UpdateTests"
          "$RUNNER_TEMP/VERITY-UpdateTests"

      - name: Build VERITY
        run: |
          xcodebuild \
            -project VERITY.xcodeproj \
            -scheme VERITY \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/VERITY-Build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify release version metadata
        run: |
          APP_PATH="$RUNNER_TEMP/VERITY-Build/Build/Products/Release/VERITY.app"
          BUILT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")
          SOURCE_VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$BUILT_VERSION" = "$SOURCE_VERSION" || {
            echo "Release build version $BUILT_VERSION does not match VERSION file $SOURCE_VERSION"
            exit 1
          }

      - name: Generate the VERITY app icon
        run: |
          APP_PATH="$RUNNER_TEMP/VERITY-Build/Build/Products/Release/VERITY.app"
          ICONSET="$RUNNER_TEMP/VERITY-AppIcon.iconset"
          mkdir -p "$APP_PATH/Contents/Resources"
          swift scripts/GenerateAppIcon.swift "$ICONSET"
          iconutil -c icns "$ICONSET" -o "$APP_PATH/Contents/Resources/AppIcon.icns"
          test -s "$APP_PATH/Contents/Resources/AppIcon.icns"

      - name: Ad-hoc sign and verify the app bundle
        run: |
          APP_PATH="$RUNNER_TEMP/VERITY-Build/Build/Products/Release/VERITY.app"
          # Ad-hoc signing gives the bundle a verifiable code signature; it is
          # not a replacement for a Developer ID certificate or notarization.
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package the Mac app and installer disk image
        run: |
          APP_PATH="$RUNNER_TEMP/VERITY-Build/Build/Products/Release/VERITY.app"
          test -d "$APP_PATH"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/VERITY-$VERSION-macOS.zip"

          STAGING="$RUNNER_TEMP/VERITY-DMG"
          mkdir -p "$STAGING"
          ditto "$APP_PATH" "$STAGING/VERITY.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "VERITY $VERSION" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$GITHUB_WORKSPACE/VERITY-$VERSION-macOS.dmg"

      - name: Upload downloadable Mac installers
        uses: actions/upload-artifact@v4
        with:
          name: VERITY-macOS
          path: |
            VERITY-*-macOS.zip
            VERITY-*-macOS.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the built app
        uses: actions/download-artifact@v4
        with:
          name: VERITY-macOS
          path: release-assets

      - name: Publish a permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DMG="$(find release-assets -name 'VERITY-*-macOS.dmg' -print -quit)"
          ZIP="$(find release-assets -name 'VERITY-*-macOS.zip' -print -quit)"
          VERSION="${DMG##*/VERITY-}"
          VERSION="${VERSION%-macOS.dmg}"
          TAG="v$VERSION"
          NOTES_FILE=".github/release-notes/$VERSION.md"
          test -n "$DMG"
          test -n "$ZIP"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Explicitly remove same-named assets first. This avoids an API
            # 422 if the release's existing assets cannot be clobbered in place.
            gh release delete-asset "$TAG" "$(basename "$DMG")" --yes || true
            gh release delete-asset "$TAG" "$(basename "$ZIP")" --yes || true
            gh release upload "$TAG" "$DMG" "$ZIP"
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --title "VERITY $TAG" --notes-file "$NOTES_FILE"
            fi
          else
            RELEASE_ARGS=(--title "VERITY $TAG" --target "$GITHUB_SHA")
            if [ -f "$NOTES_FILE" ]; then
              RELEASE_ARGS+=(--notes-file "$NOTES_FILE")
            else
              RELEASE_ARGS+=(--notes "VERITY $VERSION for macOS. Download the DMG, open it, and drag VERITY.app into Applications.")
            fi
            gh release create "$TAG" "$DMG" "$ZIP" "${RELEASE_ARGS[@]}"
          fi
