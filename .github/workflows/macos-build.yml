name: macOS build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build VERITY
        run: |
          xcodebuild \
            -project VERITY.xcodeproj \
            -scheme VERITY \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/VERITY-Build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package the Mac app and installer disk image
        run: |
          APP_PATH="$RUNNER_TEMP/VERITY-Build/Build/Products/Release/VERITY.app"
          test -d "$APP_PATH"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/VERITY-$VERSION-macOS.zip"

          STAGING="$RUNNER_TEMP/VERITY-DMG"
          mkdir -p "$STAGING"
          ditto "$APP_PATH" "$STAGING/VERITY.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "VERITY $VERSION" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$GITHUB_WORKSPACE/VERITY-$VERSION-macOS.dmg"

      - name: Upload downloadable Mac installers
        uses: actions/upload-artifact@v4
        with:
          name: VERITY-macOS
          path: |
            VERITY-*-macOS.zip
            VERITY-*-macOS.dmg
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the built app
        uses: actions/download-artifact@v4
        with:
          name: VERITY-macOS
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --title "VERITY $TAG" --generate-notes
          fi
